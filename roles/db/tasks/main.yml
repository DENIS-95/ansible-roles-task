---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install PostgreSQL and dependencies
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: Ensure PostgreSQL service is running and enabled
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Find postgresql.conf file
  ansible.builtin.find:
    paths: /etc/postgresql
    patterns: "postgresql.conf"
    recurse: true
  register: pg_conf_find

- name: Configure PostgreSQL to listen on all addresses
  ansible.builtin.lineinfile:
    path: "{{ pg_conf_find.files[0].path }}"
    regexp: "^#?listen_addresses = .*"
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

- name: Find pg_hba.conf file
  ansible.builtin.find:
    paths: /etc/postgresql
    patterns: "pg_hba.conf"
    recurse: true
  register: pg_hba_find

- name: Configure pg_hba.conf to allow remote connections
  ansible.builtin.lineinfile:
    path: "{{ pg_hba_find.files[0].path }}"
    line: "host    all             all             0.0.0.0/0               md5"
    insertafter: EOF
  notify: Restart PostgreSQL

- name: Create database user
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_pass }}"
    role_attr_flags: "LOGIN"
    state: present
  become_user: postgres
  vars:
    ansible_remote_tmp: /tmp 

- name: Create application database and set owner
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    state: present
  become_user: postgres
  vars:
    ansible_remote_tmp: /tmp 
